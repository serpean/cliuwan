name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the minimum the project supports; 25 guards against breakage on newer JDKs.
        java: ['21', '25']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Smoke-test the jar
        # The suite never launches the real binary, so this catches a jar that builds but
        # cannot start: a bad manifest, a missing dependency in the fat jar.
        run: |
          java -jar build/libs/cliuwan.jar --version
          java -jar build/libs/cliuwan.jar --help > /dev/null
          java -jar build/libs/cliuwan.jar defects --list-fields | grep -q cweId

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.java }}
          path: build/reports/tests/test/
          retention-days: 7
