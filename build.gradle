plugins {
    id 'java'
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.10.3'
}

group = 'io.github.serpean'
version = '0.3.0'
description = 'cliuwan - query Kiuwan applications and security defects from the command line'

// No Spring Boot on purpose: the CLI is invoked once per query, so JVM startup is the
// dominant cost. Picocli + the JDK HttpClient start in ~0.2s against ~1.2s for a Spring
// context.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    picocliVersion = '4.7.6'
    jacksonVersion = '2.18.2'
    junitVersion = '5.11.4'
}

dependencies {
    implementation "info.picocli:picocli:${picocliVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    annotationProcessor "info.picocli:picocli-codegen:${picocliVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
}

// The version is generated as a Java constant rather than read from the jar manifest,
// because a native image has no manifest: reading it there yields "dev" on every release
// binary. Passing -Dcliuwan.version to native-image does not work either -- that sets a
// property for the image build, not for the running image.
def generatedVersionDir = layout.buildDirectory.dir('generated/sources/version/java')

tasks.register('generateBuildInfo') {
    def outputDir = generatedVersionDir
    def projectVersion = project.version.toString()
    inputs.property('version', projectVersion)
    outputs.dir(outputDir)
    doLast {
        def file = outputDir.get().file('io/github/serpean/cliuwan/BuildInfo.java').asFile
        file.parentFile.mkdirs()
        file.text = """package io.github.serpean.cliuwan;

/** Generated at build time by the 'generateBuildInfo' task. Do not edit. */
final class BuildInfo {

    static final String VERSION = "${projectVersion}";

    private BuildInfo() {
    }
}
"""
    }
}

sourceSets.main.java.srcDir generatedVersionDir
tasks.named('compileJava') { dependsOn 'generateBuildInfo' }

application {
    mainClass = 'io.github.serpean.cliuwan.CliuwanCommand'
    applicationName = 'cliuwan'
}

// Self-contained jar: `java -jar build/libs/cliuwan.jar` with no external classpath.
tasks.register('fatJar', Jar) {
    archiveFileName = 'cliuwan.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get(),
                   'Implementation-Version': project.version
    }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
}

tasks.named('build') {
    dependsOn 'fatJar'
}

// Native binaries: one per platform, since GraalVM cannot cross-compile. Built in CI by
// .github/workflows/release.yml; locally it needs a GraalVM JDK on JAVA_HOME.
graalvmNative {
    // Left to the ambient JDK rather than letting Gradle hunt for a GraalVM toolchain: a
    // plain `./gradlew build` on any JDK 21 must keep working, and only nativeCompile
    // actually requires GraalVM.
    toolchainDetection = false

    binaries {
        main {
            imageName = 'cliuwan'
            mainClass = application.mainClass.get()
            // --no-fallback makes the build fail rather than quietly emitting an image that
            // still needs a JVM, which would defeat the point.
            buildArgs.add('--no-fallback')
            buildArgs.add('-O2')
            // Reflection metadata for the records lives in
            // src/main/resources/META-INF/native-image/. Without it the image builds and then
            // dies at runtime on getRecordComponents(), so the release workflow runs every
            // binary before publishing it.
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    // The cache tests write to disk. Point them at a build directory so they never touch
    // the real ~/.cache of whoever runs the suite.
    //
    // Credentials are deliberately not redirected here: CredentialsTest isolates itself by
    // replacing 'user.home', and setting CLIUWAN_CREDENTIALS_FILE would take precedence
    // over that replacement, which is exactly what those tests verify.
    environment 'XDG_CACHE_HOME', layout.buildDirectory.dir('test-home/cache').get().asFile.absolutePath
}
